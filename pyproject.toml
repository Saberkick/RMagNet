[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rmagnet"
version = "0.1.0"
description = "Interface-guided T/R reflection separation with a shared DiT backbone"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.8,<2.9"]

[tool.setuptools.packages.find]
where = ["src"]

